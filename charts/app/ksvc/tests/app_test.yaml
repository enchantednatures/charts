suite: ksvc-app render tests
templates:
  - templates/common.yaml
release:
  name: test-app
  namespace: test-ns

# The app chart is a pass-through wrapper: its own values.yaml is empty and the
# ksvc library loader applies the defaults. These tests exercise the app chart
# as a consumer does — values are set at the chart root, not under `ksvc:` —
# against the dependency resolved by hack/lint-app.sh.
tests:
  # -------------------------------------------------------------------------
  # Minimal install
  # -------------------------------------------------------------------------
  - it: renders a single Knative Service for a minimal install
    set:
      services.api.image.repository: ghcr.io/test/app
      services.api.image.tag: v1.0.0
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: apiVersion
          value: serving.knative.dev/v1
      - equal:
          path: metadata.name
          value: test-app-api
      - equal:
          path: metadata.namespace
          value: test-ns
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/test/app:v1.0.0

  - it: applies library defaults without an app values.yaml
    set:
      services.api.image.repository: ghcr.io/test/app
      services.api.image.tag: v1.0.0
    documentSelector:
      path: metadata.name
      value: test-app-api
    asserts:
      - equal:
          path: spec.template.metadata.annotations["autoscaling.knative.dev/min-scale"]
          value: "1"
      - equal:
          path: spec.template.spec.containerConcurrency
          value: 100

  # -------------------------------------------------------------------------
  # Full-stack pass-through: postgres + kafka + dragonfly + flagger
  # -------------------------------------------------------------------------
  - it: renders a CloudNativePG Cluster
    set:
      services.api.image.repository: ghcr.io/test/app
      services.api.image.tag: v1.0.0
      postgres.enabled: true
      postgres.instances: 2
      postgres.pooler.enabled: true
      postgres.backup.enabled: false
    documentSelector:
      path: kind
      value: Cluster
    asserts:
      - equal:
          path: apiVersion
          value: postgresql.cnpg.io/v1
      - equal:
          path: metadata.name
          value: test-app-postgres
      - equal:
          path: spec.instances
          value: 2

  - it: renders the postgres Pooler when enabled
    set:
      services.api.image.repository: ghcr.io/test/app
      services.api.image.tag: v1.0.0
      postgres.enabled: true
      postgres.pooler.enabled: true
      postgres.backup.enabled: false
    documentSelector:
      path: kind
      value: Pooler
    asserts:
      - equal:
          path: apiVersion
          value: postgresql.cnpg.io/v1
      - equal:
          path: metadata.name
          value: test-app-postgres-pooler

  - it: renders a KafkaSource that sinks to the wrapped service
    set:
      services.api.image.repository: ghcr.io/test/app
      services.api.image.tag: v1.0.0
      kafka.sources.events.sink: api
      kafka.sources.events.bootstrapServers:
        - kafka:9092
    documentSelector:
      path: kind
      value: KafkaSource
    asserts:
      - equal:
          path: apiVersion
          value: sources.knative.dev/v1beta1
      - equal:
          path: metadata.name
          value: test-app-events-kafka-source
      - contains:
          path: spec.topics
          content: events
      - equal:
          path: spec.sink.ref.name
          value: test-app-api

  - it: renders a Dragonfly cache cluster
    set:
      services.api.image.repository: ghcr.io/test/app
      services.api.image.tag: v1.0.0
      dragonfly.enabled: true
      dragonfly.replicas: 2
    documentSelector:
      path: kind
      value: Dragonfly
    asserts:
      - equal:
          path: metadata.name
          value: test-app-dragonfly
      - equal:
          path: spec.replicas
          value: 2

  - it: renders a Flagger Canary targeting the Knative Service
    set:
      services.api.image.repository: ghcr.io/test/app
      services.api.image.tag: v1.0.0
      services.api.flagger.enabled: true
    documentSelector:
      path: kind
      value: Canary
    asserts:
      - equal:
          path: apiVersion
          value: flagger.app/v1beta1
      - equal:
          path: metadata.name
          value: test-app-api
      - equal:
          path: spec.targetRef.kind
          value: Service
      - equal:
          path: spec.targetRef.name
          value: test-app-api

  - it: renders all full-stack kinds together
    set:
      services.api.image.repository: ghcr.io/test/app
      services.api.image.tag: v1.0.0
      services.api.flagger.enabled: true
      postgres.enabled: true
      postgres.pooler.enabled: true
      postgres.backup.enabled: false
      kafka.sources.events.sink: api
      kafka.sources.events.bootstrapServers:
        - kafka:9092
      dragonfly.enabled: true
    asserts:
      # Service (api), Service (Kafka DLQ), Canary, Cluster, Pooler,
      # KafkaSource, Dragonfly, PodMonitor, and PrometheusRule.
      - hasDocuments:
          count: 9
