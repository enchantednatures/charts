apiVersion: v2
name: ksvc-app
description: >-
  A ksvc library powered chart template for deploying Knative Services with
  optional CloudNativePG PostgreSQL, Kafka event sources, DragonflyDB cache
  clusters, and Flagger canary releases.
type: application
version: 1.0.1
appVersion: "1.0.0"
kubeVersion: ">=1.28.0"
icon: https://raw.githubusercontent.com/enchantednatures/charts/main/docs/icon.svg
home: https://github.com/enchantednatures/charts
sources:
  - https://github.com/enchantednatures/charts
maintainers:
  - name: enchantednatures
    url: https://github.com/enchantednatures
keywords:
  - knative
  - serverless
  - cloudnativepg
  - dragonfly
  - flagger
  - kafka
dependencies:
  - name: ksvc
    version: 1.2.0
    repository: oci://ghcr.io/enchantednatures/charts
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: MIT
  artifacthub.io/changes: |
    - kind: added
      description: ksvc-app application wrapper for the ksvc 1.0 library chart
    - kind: added
      description: Values surface follows the frozen ksvc 1.0 API, including multi-service, Kafka, PostgreSQL, DragonflyDB, and Flagger settings
    - kind: changed
      description: See MIGRATION.md for the 1.0 upgrade guide and breaking changes
  artifacthub.io/images: |
    - name: event-display
      image: gcr.io/knative-releases/knative.dev/eventing/cmd/event_display:latest
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/enchantednatures/charts
    - name: Documentation
      url: https://github.com/enchantednatures/charts/blob/main/charts/app/ksvc/README.md
    - name: Migration guide
      url: https://github.com/enchantednatures/charts/blob/main/MIGRATION.md
