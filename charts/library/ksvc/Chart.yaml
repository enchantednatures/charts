apiVersion: v2
name: ksvc
description: >-
  Helm library chart for deploying Knative Services with optional
  CloudNativePG PostgreSQL, Kafka and PingSource (scheduled) event sources,
  managed Strimzi or Redpanda Kafka clusters, Knative Broker/Trigger,
  DragonflyDB cache clusters, and Flagger canary releases.
type: library
version: 0.10.0
appVersion: "1.0.0"
kubeVersion: ">=1.28.0"
home: https://github.com/enchantednatures/charts
sources:
  - https://github.com/enchantednatures/charts
maintainers:
  - name: enchantednatures
    url: https://github.com/enchantednatures
keywords:
  - knative
  - serverless
  - cloudnativepg
  - dragonfly
  - flagger
  - kafka
  - pingsource
  - scheduled
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: MIT
