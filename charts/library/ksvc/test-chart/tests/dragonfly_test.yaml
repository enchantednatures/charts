suite: dragonfly tests
templates:
  - templates/common.yaml
capabilities:
  apiVersions:
    - monitoring.coreos.com/v1
    - sources.knative.dev/v1
    - dragonflydb.io/v1alpha1
    - objectbucket.io/v1alpha1
    - flagger.app/v1beta1
    - cert-manager.io/v1
    - postgresql.cnpg.io/v1
    - barmancloud.cnpg.io/v1
    - policies.kyverno.io/v1beta1
    - policies.kyverno.io/v1
set:
  services.api.image.repository: test/image
  dragonfly.enabled: true
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should render Dragonfly when enabled
    documentIndex: 1
    asserts:
      - isKind:
          of: Dragonfly
      - equal:
          path: apiVersion
          value: dragonflydb.io/v1alpha1

  - it: should set correct name
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: test-release-dragonfly

  - it: should set namespace
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.namespace
          value: test-ns

  - it: should set default replicas
    documentIndex: 1
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should set custom replicas
    set:
      dragonfly.replicas: 5
    documentIndex: 1
    asserts:
      - equal:
          path: spec.replicas
          value: 5

  - it: should set image with tag
    set:
      dragonfly.image: ghcr.io/dragonflydb/dragonfly
      dragonfly.imageTag: v1.37.0
    documentIndex: 1
    asserts:
      - equal:
          path: spec.image
          value: "ghcr.io/dragonflydb/dragonfly:v1.37.0"

  - it: should set resources
    set:
      dragonfly.resources.requests.cpu: "1"
      dragonfly.resources.requests.memory: 2Gi
      dragonfly.resources.limits.cpu: "2"
      dragonfly.resources.limits.memory: 4Gi
    documentIndex: 1
    asserts:
      - equal:
          path: spec.resources.requests.cpu
          value: "1"
      - equal:
          path: spec.resources.limits.memory
          value: 4Gi

  - it: "defaults the pod securityContext to RuntimeDefault seccomp plus the operator's fsGroup"
    documentIndex: 1
    asserts:
      - equal:
          path: spec.podSecurityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.podSecurityContext.fsGroup
          value: 999

  - it: "defaults the container securityContext to the restricted profile (non-root, no privilege escalation, all caps dropped)"
    documentIndex: 1
    asserts:
      - equal:
          path: spec.containerSecurityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.containerSecurityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.containerSecurityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.containerSecurityContext.capabilities.drop
          value:
            - ALL

  - it: "lets consumers override the Dragonfly security contexts"
    set:
      dragonfly.podSecurityContext.fsGroup: 1000
      dragonfly.containerSecurityContext.runAsNonRoot: false
      dragonfly.containerSecurityContext.allowPrivilegeEscalation: true
    documentIndex: 1
    asserts:
      - equal:
          path: spec.podSecurityContext.fsGroup
          value: 1000
      - equal:
          path: spec.containerSecurityContext.runAsNonRoot
          value: false
      - equal:
          path: spec.containerSecurityContext.allowPrivilegeEscalation
          value: true

  - it: "lets consumers opt out of the Dragonfly security contexts with explicit empty maps"
    set:
      dragonfly.podSecurityContext: {}
      dragonfly.containerSecurityContext: {}
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.podSecurityContext
      - notExists:
          path: spec.containerSecurityContext

  - it: should set authentication when secret name provided
    set:
      dragonfly.authentication.passwordFromSecret.name: my-secret
      dragonfly.authentication.passwordFromSecret.key: redis-password
    documentIndex: 1
    asserts:
      - equal:
          path: spec.authentication.passwordFromSecret.name
          value: my-secret
      - equal:
          path: spec.authentication.passwordFromSecret.key
          value: redis-password

  - it: should not render authentication when secret name empty
    documentIndex: 1
    asserts:
      - isNull:
          path: spec.authentication

  - it: should set TLS when secretName provided
    set:
      dragonfly.tls.secretName: dragonfly-tls
    documentIndex: 1
    asserts:
      - equal:
          path: spec.tlsSecretRef.name
          value: dragonfly-tls

  - it: should not render TLS when secretName empty
    documentIndex: 1
    asserts:
      - isNull:
          path: spec.tlsSecretRef

  - it: should render PVC snapshot when enabled
    set:
      dragonfly.snapshot.enabled: true
      dragonfly.snapshot.storage.size: 20Gi
      dragonfly.snapshot.storage.storageClassName: gp3
    documentIndex: 1
    asserts:
      - equal:
          path: spec.snapshot.cron
          value: "0 */6 * * *"
      - equal:
          path: spec.snapshot.persistentVolumeClaimSpec.resources.requests.storage
          value: 20Gi
      - equal:
          path: spec.snapshot.persistentVolumeClaimSpec.storageClassName
          value: "gp3"

  - it: should render S3 snapshot when dir set
    set:
      dragonfly.snapshot.enabled: true
      dragonfly.snapshot.dir: "s3://my-bucket/dragonfly"
    documentIndex: 1
    asserts:
      - equal:
          path: spec.snapshot.dir
          value: "s3://my-bucket/dragonfly"
      - isNull:
          path: spec.snapshot.persistentVolumeClaimSpec

  - it: should render existing PVC snapshot
    set:
      dragonfly.snapshot.enabled: true
      dragonfly.snapshot.existingPersistentVolumeClaimName: my-pvc
    documentIndex: 1
    asserts:
      - equal:
          path: spec.snapshot.existingPersistentVolumeClaimName
          value: my-pvc
      - isNull:
          path: spec.snapshot.persistentVolumeClaimSpec

  - it: should not render snapshot when disabled
    documentIndex: 1
    asserts:
      - isNull:
          path: spec.snapshot

  - it: should set PDB
    set:
      dragonfly.pdb.minAvailable: 2
    documentIndex: 1
    asserts:
      - equal:
          path: spec.pdb.minAvailable
          value: 2

  - it: "should treat minAvailable 0 alone as no PDB constraint (regression: was dropped as falsy and left a bare pdb block)"
    set:
      dragonfly.pdb.minAvailable: 0
    documentIndex: 1
    asserts:
      - isNull:
          path: spec.pdb

  - it: "should reject both PDB fields being non-zero (mutual exclusivity is enforced at render time)"
    set:
      dragonfly.pdb.minAvailable: 2
      dragonfly.pdb.maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "dragonfly.pdb: minAvailable and maxUnavailable are mutually exclusive — set one of them to 0"

  - it: "should not render an empty pdb spec (regression: bare null pdb)"
    set:
      dragonfly.pdb.minAvailable: 0
      dragonfly.pdb.maxUnavailable: 0
    documentIndex: 1
    asserts:
      - isNull:
          path: spec.pdb

  - it: should set args
    set:
      dragonfly.args:
        - --cluster_mode=emulated
        - --proactor_threads=2
    documentIndex: 1
    asserts:
      - equal:
          path: spec.args
          value:
            - --cluster_mode=emulated
            - --proactor_threads=2

  - it: should set serviceSpec
    set:
      dragonfly.serviceSpec.type: LoadBalancer
      dragonfly.serviceSpec.annotations.test: "true"
    documentIndex: 1
    asserts:
      - equal:
          path: spec.serviceSpec.type
          value: LoadBalancer

  - it: should include component label
    documentIndex: 1
    asserts:
      - isNotNull:
          path: metadata.labels["app.kubernetes.io/component"]
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: cache

  - it: should not render Dragonfly when disabled
    set:
      dragonfly.enabled: false
    asserts:
      - hasDocuments:
          count: 1
