suite: deployment service tests
templates:
  - templates/common.yaml
set:
  services.api.image.repository: test/image
  services.api.image.tag: "v1.0.0"
  services.api.workload.type: Deployment
release:
  name: test-release
  namespace: test-ns
tests:
  # Render order: doc 0 = Deployment, doc 1 = core Service.
  - it: should render a core v1 Service
    documentIndex: 1
    asserts:
      - isKind:
          of: Service
      - equal:
          path: apiVersion
          value: v1

  - it: should set the Service name
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: test-release-api

  - it: should default the Service type to ClusterIP
    documentIndex: 1
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP

  - it: should render a custom LoadBalancer type
    set:
      services.api.service.type: LoadBalancer
    documentIndex: 1
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer

  - it: should default the Service port to 80
    documentIndex: 1
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 80

  - it: should render a custom Service port
    set:
      services.api.service.port: 8080
    documentIndex: 1
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: should default targetPort to the container port 8080
    documentIndex: 1
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 8080

  - it: should follow a custom container port in targetPort
    set:
      services.api.port: 9090
    documentIndex: 1
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: 9090

  - it: should set selector matchLabels to name and instance
    documentIndex: 1
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: test-release-api
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: test-release

  - it: should default sessionAffinity to None without a config block
    documentIndex: 1
    asserts:
      - equal:
          path: spec.sessionAffinity
          value: None
      - notExists:
          path: spec.sessionAffinityConfig

  - it: should render default ClientIP session affinity config
    set:
      services.api.service.sessionAffinity: ClientIP
    documentIndex: 1
    asserts:
      - equal:
          path: spec.sessionAffinity
          value: ClientIP
      - equal:
          path: spec.sessionAffinityConfig.clientIP.timeoutSeconds
          value: 10800

  - it: should render a custom ClientIP timeout
    set:
      services.api.service.sessionAffinity: ClientIP
      services.api.service.sessionAffinityConfig.clientIP.timeoutSeconds: 300
    documentIndex: 1
    asserts:
      - equal:
          path: spec.sessionAffinityConfig.clientIP.timeoutSeconds
          value: 300

  - it: should not set externalTrafficPolicy by default
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.externalTrafficPolicy

  - it: should render externalTrafficPolicy Local for NodePort
    set:
      services.api.service.type: NodePort
      services.api.service.externalTrafficPolicy: Local
    documentIndex: 1
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.externalTrafficPolicy
          value: Local

  - it: should render externalTrafficPolicy Cluster for LoadBalancer
    set:
      services.api.service.type: LoadBalancer
      services.api.service.externalTrafficPolicy: Cluster
    documentIndex: 1
    asserts:
      - equal:
          path: spec.externalTrafficPolicy
          value: Cluster

  - it: should render externalTrafficPolicy Local for LoadBalancer
    set:
      services.api.service.type: LoadBalancer
      services.api.service.externalTrafficPolicy: Local
    documentIndex: 1
    asserts:
      - equal:
          path: spec.externalTrafficPolicy
          value: Local

  - it: should place service.service.annotations on the core Service only
    set:
      services.api.service.annotations.foo: bar
      services.api.annotations.baz: qux
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.annotations.foo
          value: bar
      - notExists:
          path: metadata.annotations.baz

  - it: should place service.annotations on the Deployment only
    set:
      services.api.service.annotations.foo: bar
      services.api.annotations.baz: qux
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations.baz
          value: qux
      - notExists:
          path: metadata.annotations.foo

  - it: should render service labels on the Service
    set:
      services.api.labels.foo: bar
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.labels.foo
          value: bar

  - it: should merge service.labels into the core Service metadata
    set:
      services.api.service.labels.custom: svc-only
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.labels.custom
          value: svc-only

  - it: should not leak service.labels onto the Deployment
    set:
      services.api.service.labels.custom: svc-only
    documentIndex: 0
    asserts:
      - notExists:
          path: metadata.labels.custom
