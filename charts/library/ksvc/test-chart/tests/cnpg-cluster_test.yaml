suite: cnpg cluster tests
templates:
  - templates/common.yaml
capabilities:
  apiVersions:
    - monitoring.coreos.com/v1
    - sources.knative.dev/v1
    - dragonflydb.io/v1alpha1
    - objectbucket.io/v1alpha1
    - flagger.app/v1beta1
    - cert-manager.io/v1
    - postgresql.cnpg.io/v1
    - barmancloud.cnpg.io/v1
    - policies.kyverno.io/v1beta1
    - policies.kyverno.io/v1
set:
  services.api.image.repository: test/image
  postgres.enabled: true
  postgres.pooler.enabled: false
  postgres.backup.enabled: false
  postgres.monitoring.enabled: false
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should render CNPG Cluster when postgres enabled
    documentIndex: 1
    asserts:
      - isKind:
          of: Cluster
      - equal:
          path: apiVersion
          value: postgresql.cnpg.io/v1

  - it: should set correct cluster name
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: test-release-postgres

  - it: should set instance count
    set:
      postgres.instances: 5
    documentIndex: 1
    asserts:
      - equal:
          path: spec.instances
          value: 5

  - it: "should set imageCatalogRef with the required catalog name (regression: CNPG rejects nameless ref)"
    documentIndex: 1
    asserts:
      - equal:
          path: spec.imageCatalogRef.apiGroup
          value: postgresql.cnpg.io
      - equal:
          path: spec.imageCatalogRef.kind
          value: ClusterImageCatalog
      - equal:
          path: spec.imageCatalogRef.name
          value: postgresql
      - equal:
          path: spec.imageCatalogRef.major
          value: 16

  - it: should allow a custom image catalog name
    set:
      postgres.imageCatalog.name: "my-postgres-catalog"
    documentIndex: 1
    asserts:
      - equal:
          path: spec.imageCatalogRef.name
          value: "my-postgres-catalog"

  - it: should set storage size
    set:
      postgres.storage.size: "500Gi"
      postgres.storage.storageClassName: "gp3"
    documentIndex: 1
    asserts:
      - equal:
          path: spec.storage.size
          value: "500Gi"
      - equal:
          path: spec.storage.storageClass
          value: "gp3"

  - it: "renders the CNPG storage class field as storageClass, not storageClassName (regression: CNPG CRD has no storageClassName)"
    set:
      postgres.storage.storageClassName: "gp3"
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.storage.storageClassName

  - it: "renders no spec.monitoring block on the Cluster (regression: CNPG CRD has no monitoring.enabled/podMonitorEnabled)"
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.monitoring
      - notExists:
          path: spec.monitoring.enabled
      - notExists:
          path: spec.monitoring.podMonitorEnabled

  - it: should include barman plugin when backup enabled
    set:
      postgres.backup.enabled: true
      postgres.backup.objectStore.destinationPath: "s3://test/"
      postgres.backup.objectStore.endpointURL: "http://minio:9000"
    documentIndex: 1
    asserts:
      - isNotNull:
          path: spec.plugins

  - it: should not include barman plugin when backup disabled
    set:
      postgres.backup.enabled: false
    documentIndex: 1
    asserts:
      - isNull:
          path: spec.plugins

  - it: "should default postInitApplicationSQL to pg_stat_statements only (regression: log_statement logged credentials/PII)"
    documentIndex: 1
    asserts:
      - equal:
          path: spec.bootstrap.initdb.postInitApplicationSQL
          value:
            - "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"

  - it: should not render Cluster when postgres disabled
    set:
      postgres.enabled: false
    asserts:
      - hasDocuments:
          count: 1

  - it: should render spec.imagePullSecrets from postgres.imagePullSecrets
    set:
      postgres.imagePullSecrets:
        - name: pg-pull
    documentIndex: 1
    asserts:
      - equal:
          path: spec.imagePullSecrets
          value:
            - name: pg-pull

  - it: should thread global.imagePullSecrets into the CNPG cluster
    set:
      global.imagePullSecrets:
        - name: global-pull
    documentIndex: 1
    asserts:
      - equal:
          path: spec.imagePullSecrets
          value:
            - name: global-pull

  - it: should combine the cluster's own and global imagePullSecrets (own first)
    set:
      postgres.imagePullSecrets:
        - name: pg-pull
      global.imagePullSecrets:
        - name: global-pull
    documentIndex: 1
    asserts:
      - equal:
          path: spec.imagePullSecrets
          value:
            - name: pg-pull
            - name: global-pull

  - it: should not render imagePullSecrets when both lists are empty
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.imagePullSecrets

  - it: should omit spec.storage.storageClass when storageClassName is empty
    set:
      postgres.storage.storageClassName: ""
    documentIndex: 1
    asserts:
      - notExists:
          path: spec.storage.storageClass

  - it: should coerce numeric and boolean parameter values to strings
    set:
      postgres.parameters.max_connections: 300
      postgres.parameters.wal_compression: true
    documentIndex: 1
    asserts:
      - equal:
          path: spec.postgresql.parameters.max_connections
          value: "300"
      - equal:
          path: spec.postgresql.parameters.wal_compression
          value: "true"
