suite: flagger canary tests
templates:
  - templates/common.yaml
set:
  services.api.image.repository: test/image
  services.api.flagger.enabled: true
release:
  name: test-release
  namespace: test-ns
tests:
  # With flagger enabled on 'api' service:
  # doc 0 = Knative Service (api), doc 1 = Canary (api)
  - it: should render Canary when flagger enabled
    documentIndex: 1
    asserts:
      - isKind:
          of: Canary
      - equal:
          path: apiVersion
          value: flagger.app/v1beta1

  - it: should set correct canary name
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: test-release-api

  - it: should reference the knative service
    documentIndex: 1
    asserts:
      - equal:
          path: spec.targetRef.name
          value: test-release-api

  - it: should set analysis parameters
    set:
      services.api.flagger.analysis.interval: 2m
      services.api.flagger.analysis.threshold: 10
      services.api.flagger.analysis.maxWeight: 80
      services.api.flagger.analysis.stepWeight: 20
    documentIndex: 1
    asserts:
      - equal:
          path: spec.analysis.interval
          value: 2m
      - equal:
          path: spec.analysis.threshold
          value: 10
      - equal:
          path: spec.analysis.maxWeight
          value: 80
      - equal:
          path: spec.analysis.stepWeight
          value: 20

  - it: should set metric thresholds
    set:
      services.api.flagger.metrics.successRateThreshold: 95
      services.api.flagger.metrics.latencyP99ThresholdMs: 1000
    documentIndex: 1
    asserts:
      - equal:
          path: spec.analysis.metrics[0].thresholdRange.min
          value: 95
      - equal:
          path: spec.analysis.metrics[1].thresholdRange.max
          value: 1000

  - it: should include webhooks when loadTest enabled
    set:
      services.api.flagger.loadTest.enabled: true
    documentIndex: 1
    asserts:
      - isNotNull:
          path: spec.analysis.webhooks

  - it: should not render Canary when flagger disabled
    set:
      services.api.flagger.enabled: false
    asserts:
      - hasDocuments:
          count: 1

  - it: should use nameOverride in canary and targetRef names
    set:
      services.api.nameOverride: ""
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: test-release
      - equal:
          path: spec.targetRef.name
          value: test-release

  - it: derives both webhook URLs from flagger.loadTester
    set:
      flagger.loadTester.namespace: canary-system
      flagger.loadTester.serviceName: loadtest
      flagger.loadTester.port: 8080
      flagger.loadTester.path: /run
    documentIndex: 1
    asserts:
      - equal:
          path: spec.analysis.webhooks[0].url
          value: http://loadtest.canary-system:8080/run
      - equal:
          path: spec.analysis.webhooks[1].url
          value: http://loadtest.canary-system:8080/run

  - it: keeps a per-service webhookUrl override
    set:
      flagger.loadTester.namespace: canary-system
      services.api.flagger.loadTest.webhookUrl: http://custom-loadtest/run
    documentIndex: 1
    asserts:
      - equal:
          path: spec.analysis.webhooks[0].url
          value: http://custom-loadtest/run
      - equal:
          path: spec.analysis.webhooks[1].url
          value: http://custom-loadtest/run

  - it: renders custom smoke/load paths and timeouts
    set:
      services.api.flagger.loadTest.smokePath: /live
      services.api.flagger.loadTest.path: /api
      services.api.flagger.loadTest.smokeTimeout: 2m
      services.api.flagger.loadTest.timeout: 10m
    documentIndex: 1
    asserts:
      - equal:
          path: spec.analysis.webhooks[0].timeout
          value: 2m
      - matchRegex:
          path: spec.analysis.webhooks[0].metadata.script
          pattern: "/live"
      - equal:
          path: spec.analysis.webhooks[1].timeout
          value: 10m
      - matchRegex:
          path: spec.analysis.webhooks[1].metadata.script
          pattern: "/api"

  - it: uses global.clusterDomain in the k6 service URLs
    set:
      global.clusterDomain: example.internal
    documentIndex: 1
    asserts:
      - matchRegex:
          path: spec.analysis.webhooks[0].metadata.script
          pattern: "svc\\.example\\.internal/health/live"
      - matchRegex:
          path: spec.analysis.webhooks[1].metadata.script
          pattern: "svc\\.example\\.internal/"
