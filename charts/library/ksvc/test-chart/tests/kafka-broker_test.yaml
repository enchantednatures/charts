suite: kafka broker tests
templates:
  - templates/common.yaml
set:
  services.api.image.repository: test/image
  kafka.broker.enabled: true
release:
  name: test-release
  namespace: test-ns
tests:
  # Document order with broker enabled and no sources/triggers:
  # doc 0 = Knative Service (api), doc 1 = Broker ConfigMap, doc 2 = Broker
  - it: should render the broker ConfigMap
    documentIndex: 1
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-release-kafka-broker-config
      - equal:
          path: metadata.namespace
          value: test-ns

  - it: should render the default broker config values
    documentIndex: 1
    asserts:
      - equal:
          path: data["bootstrap.servers"]
          value: "kafka.kafka.svc.cluster.local:9092"
      - equal:
          path: data["default.topic.partitions"]
          value: "10"
      - equal:
          path: data["default.topic.replication.factor"]
          value: "3"

  - it: should render custom broker config values
    set:
      kafka.broker.config.bootstrapServers:
        - kafka-1.prod.svc:9092
        - kafka-2.prod.svc:9092
      kafka.broker.config.topicPartitions: 24
      kafka.broker.config.topicReplicationFactor: 5
      kafka.broker.config.authSecretName: my-kafka-secret
      kafka.broker.config.extra:
        security.protocol: SASL_SSL
    documentIndex: 1
    asserts:
      - equal:
          path: data["bootstrap.servers"]
          value: "kafka-1.prod.svc:9092,kafka-2.prod.svc:9092"
      - equal:
          path: data["default.topic.partitions"]
          value: "24"
      - equal:
          path: data["default.topic.replication.factor"]
          value: "5"
      - equal:
          path: data["auth.secret.ref.name"]
          value: my-kafka-secret
      - equal:
          path: data["security.protocol"]
          value: SASL_SSL

  - it: should render the Broker
    documentIndex: 2
    asserts:
      - isKind:
          of: Broker
      - equal:
          path: apiVersion
          value: eventing.knative.dev/v1
      - equal:
          path: metadata.name
          value: test-release-kafka-broker
      - equal:
          path: metadata.annotations["eventing.knative.dev/broker.class"]
          value: Kafka

  - it: should reference the broker ConfigMap
    documentIndex: 2
    asserts:
      - equal:
          path: spec.config.name
          value: test-release-kafka-broker-config
      - equal:
          path: spec.config.kind
          value: ConfigMap
      - equal:
          path: spec.config.namespace
          value: test-ns

  - it: should render global and broker annotations
    set:
      global.annotations:
        team: platform
      kafka.broker.annotations:
        kafka.eventing.knative.dev/delivery.order: ordered
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.annotations.team
          value: platform
      - equal:
          path: metadata.annotations["kafka.eventing.knative.dev/delivery.order"]
          value: ordered

  - it: should render the external topic annotation
    set:
      kafka.broker.externalTopic: my-external-topic
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.annotations["kafka.eventing.knative.dev/external.topic"]
          value: my-external-topic

  - it: should render broker delivery and dead letter sink
    set:
      kafka.broker.delivery.retry: 10
      kafka.broker.delivery.backoffPolicy: linear
      kafka.broker.delivery.backoffDelay: PT5S
      kafka.broker.delivery.deadLetterSink.enabled: true
      kafka.broker.delivery.deadLetterSink.ref.name: my-dlq-service
    documentIndex: 2
    asserts:
      - equal:
          path: spec.delivery.retry
          value: 10
      - equal:
          path: spec.delivery.backoffPolicy
          value: linear
      - equal:
          path: spec.delivery.backoffDelay
          value: PT5S
      - equal:
          path: spec.delivery.deadLetterSink.ref.name
          value: my-dlq-service

  - it: should not render the broker when disabled
    set:
      kafka.broker.enabled: false
    asserts:
      - hasDocuments:
          count: 1

  - it: should fail when a source sets a sink while the broker is enabled
    set:
      kafka.sources.events.topic: events
      kafka.sources.events.sink: api
    asserts:
      - failedTemplate:
          errorMessage: "kafka.sources.events.sink must not be set when kafka.broker.enabled=true — sources sink to the broker; remove sink or disable the broker"

  - it: should fail when broker bootstrap servers are empty
    set:
      kafka.broker.config.bootstrapServers: []
    asserts:
      - failedTemplate:
          errorMessage: "kafka.broker.config.bootstrapServers must contain at least one server when kafka.broker.enabled=true"
