suite: cnpg pooler tests
templates:
  - templates/common.yaml
set:
  services.api.image.repository: test/image
  postgres.enabled: true
  postgres.pooler.enabled: true
  postgres.backup.enabled: false
  postgres.monitoring.enabled: false
release:
  name: test-release
  namespace: test-ns
tests:
  # With postgres enabled + pooler enabled (no backup, no monitoring):
  # doc 0 = Knative Service (api), doc 1 = CNPG Cluster, doc 2 = Pooler
  - it: should render Pooler when enabled
    documentIndex: 2
    asserts:
      - isKind:
          of: Pooler
      - equal:
          path: apiVersion
          value: postgresql.cnpg.io/v1

  - it: should set correct pooler name
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: test-release-postgres-pooler

  - it: should reference the correct cluster
    documentIndex: 2
    asserts:
      - equal:
          path: spec.cluster.name
          value: test-release-postgres

  - it: should set pooler parameters
    set:
      postgres.pooler.instances: 5
      postgres.pooler.type: ro
      postgres.pooler.poolMode: session
    documentIndex: 2
    asserts:
      - equal:
          path: spec.instances
          value: 5
      - equal:
          path: spec.type
          value: ro
      - equal:
          path: spec.pgbouncer.poolMode
          value: session

  - it: "renders no spec.monitoring block on the Pooler (regression: only a deprecated enablePodMonitor field exists; the chart does not manage pooler monitors)"
    documentIndex: 2
    asserts:
      - notExists:
          path: spec.monitoring
      - notExists:
          path: spec.monitoring.enabled
      - notExists:
          path: spec.monitoring.podMonitorEnabled

  - it: "renders pooler resources under template.spec.containers[name=pgbouncer] (regression: PodSpec has no top-level resources and requires containers)"
    set:
      postgres.pooler.resources.requests.cpu: "250m"
    documentIndex: 2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: pgbouncer
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "250m"
      - notExists:
          path: spec.template.spec.resources

  - it: "defaults the pgbouncer container to a restricted securityContext (non-root, no privilege escalation, all caps dropped, RuntimeDefault seccomp)"
    documentIndex: 2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL
      - notExists:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem

  - it: "lets consumers override the pooler securityContext"
    set:
      postgres.pooler.securityContext.runAsNonRoot: false
      postgres.pooler.securityContext.runAsUser: 999
      postgres.pooler.securityContext.allowPrivilegeEscalation: true
    documentIndex: 2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 999
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: true

  - it: "lets consumers opt out of the pooler securityContext with an explicit empty map"
    set:
      postgres.pooler.securityContext: {}
    documentIndex: 2
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext
