suite: deployment PDB tests
templates:
  - templates/common.yaml
set:
  services.api.image.repository: test/image
  services.api.image.tag: "v1.0.0"
  services.api.workload.type: Deployment
release:
  name: test-release
  namespace: test-ns
tests:
  # Render order: doc 0 = Deployment, doc 1 = core Service, doc 2 = PodDisruptionBudget.
  - it: should not render a PDB by default
    asserts:
      - hasDocuments:
          count: 2

  - it: should render a policy/v1 PodDisruptionBudget when enabled
    set:
      services.api.podDisruptionBudget.enabled: true
      services.api.podDisruptionBudget.minAvailable: 1
    documentIndex: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: apiVersion
          value: policy/v1

  - it: should set the PDB name
    set:
      services.api.podDisruptionBudget.enabled: true
      services.api.podDisruptionBudget.minAvailable: 1
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: test-release-api

  - it: should set the PDB namespace
    set:
      services.api.podDisruptionBudget.enabled: true
      services.api.podDisruptionBudget.minAvailable: 1
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.namespace
          value: test-ns

  - it: should set the PDB selector matchLabels to name and instance
    set:
      services.api.podDisruptionBudget.enabled: true
      services.api.podDisruptionBudget.minAvailable: 1
    documentIndex: 2
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: test-release-api
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: test-release

  - it: should render minAvailable when set
    set:
      services.api.podDisruptionBudget.enabled: true
      services.api.podDisruptionBudget.minAvailable: 1
    documentIndex: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1

  - it: should render maxUnavailable and omit minAvailable when set
    set:
      services.api.podDisruptionBudget.enabled: true
      services.api.podDisruptionBudget.maxUnavailable: 1
    documentIndex: 2
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  - it: should render a percent-string minAvailable
    set:
      services.api.podDisruptionBudget.enabled: true
      services.api.podDisruptionBudget.minAvailable: "50%"
    documentIndex: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: "50%"
