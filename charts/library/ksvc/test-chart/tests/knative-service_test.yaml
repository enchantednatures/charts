suite: knative service tests
templates:
  - templates/common.yaml
set:
  services.api.image.repository: test/image
  services.api.image.tag: "v1.0.0"
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should render a Knative Service
    documentIndex: 0
    asserts:
      - isKind:
          of: Service
      - equal:
          path: apiVersion
          value: serving.knative.dev/v1

  - it: should set the correct name
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: test-release-api

  - it: should set the correct namespace
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.namespace
          value: test-ns

  - it: should set scaling annotations
    set:
      services.api.scaling.minScale: 2
      services.api.scaling.maxScale: 20
      services.api.scaling.target: 50
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.metadata.annotations["autoscaling.knative.dev/min-scale"]
          value: "2"
      - equal:
          path: spec.template.metadata.annotations["autoscaling.knative.dev/max-scale"]
          value: "20"
      - equal:
          path: spec.template.metadata.annotations["autoscaling.knative.dev/target"]
          value: "50"

  - it: should not render the metric annotation when unset
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["autoscaling.knative.dev/metric"]

  - it: should render the metric annotation when set
    set:
      services.api.scaling.metric: rps
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.metadata.annotations["autoscaling.knative.dev/metric"]
          value: "rps"

  - it: should set resource limits
    set:
      services.api.resources.limits.cpu: "2"
      services.api.resources.limits.memory: "1Gi"
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "1Gi"

  - it: should use default port 8080
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

  - it: "should render a custom port (regression: port was locked to 8080 by schema const)"
    set:
      services.api.port: 9090
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 9090

  - it: should enforce security context
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: should include flux image policy comment when set
    set:
      services.api.image.fluxImagePolicy: "flux-system:my-service"
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "test/image:v1.0.0"

  - it: should always mount tmp volume
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  - it: should set env vars when provided
    set:
      services.api.env:
        - name: MY_VAR
          value: "hello"
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: MY_VAR

  - it: should render only one document when single service and no features enabled
    asserts:
      - hasDocuments:
          count: 1

  - it: should include component label
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: api

  - it: should render multiple services
    set:
      services.api.image.repository: test/api
      services.worker.image.repository: test/worker
    asserts:
      - hasDocuments:
          count: 2

  - it: should use nameOverride as name suffix when set
    set:
      services.api.nameOverride: web
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: test-release-web

  - it: should produce release name only when nameOverride is empty string
    set:
      services.api.nameOverride: ""
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: test-release

  - it: should keep component label as the map key even with nameOverride
    set:
      services.api.nameOverride: ""
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: api

  # ---------- probes, pull policy, envFrom, secrets and volumes ----------
  - it: should render custom liveness probe fields
    set:
      services.api.probes.liveness.path: /live
      services.api.probes.liveness.port: 8081
      services.api.probes.liveness.initialDelaySeconds: 7
      services.api.probes.liveness.periodSeconds: 11
      services.api.probes.liveness.timeoutSeconds: 4
      services.api.probes.liveness.failureThreshold: 6
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /live
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 8081
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 7
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 11
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 4
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 6

  - it: should render custom readiness probe fields
    set:
      services.api.probes.readiness.path: /ready
      services.api.probes.readiness.port: 8082
      services.api.probes.readiness.initialDelaySeconds: 9
      services.api.probes.readiness.periodSeconds: 13
      services.api.probes.readiness.timeoutSeconds: 5
      services.api.probes.readiness.failureThreshold: 8
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8082
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 9
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 13
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 8

  - it: should render imagePullSecrets
    set:
      services.api.image.imagePullSecrets:
        - name: registry-creds
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: registry-creds

  - it: should render a custom image pull policy
    set:
      services.api.image.pullPolicy: Always
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: should render envFrom secretRef and configMapRef entries
    set:
      services.api.envFrom:
        - secretRef:
            name: app-secret
        - configMapRef:
            name: app-config
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: app-secret
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].configMapRef.name
          value: app-config

  - it: should append extra volumes and volumeMounts after the reserved tmp entries
    set:
      services.api.volumes:
        - name: data
          emptyDir: {}
      services.api.volumeMounts:
        - name: data
          mountPath: /data
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: tmp
      - equal:
          path: spec.template.spec.volumes[1].name
          value: data
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: tmp
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: data
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: /data

  - it: should not render the scaling class annotation by default
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["autoscaling.knative.dev/class"]

  - it: should render the scaling class annotation when set
    set:
      services.api.scaling.class: kpa.autoscaling.knative.dev
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.metadata.annotations["autoscaling.knative.dev/class"]
          value: kpa.autoscaling.knative.dev
