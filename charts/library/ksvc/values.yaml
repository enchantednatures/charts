# =============================================================================
# Global Settings
# =============================================================================
global:
  # -- Override the chart name (defaults to the chart name). Also sets the
  # `app.kubernetes.io/name` label on every rendered resource.
  nameOverride: ""
  # -- Override the fully qualified release name used for resource names
  # (defaults to `<release>-<chart>`).
  fullnameOverride: ""

  # -- Labels added to every rendered resource.
  labels: {}

  # -- Annotations added to every rendered resource (Knative Services and DLQ
  # services, CNPG Cluster/Pooler/ObjectStore/ScheduledBackup/PodMonitor/
  # PrometheusRule, KafkaSource, Dragonfly, cert-manager Certificates, Kyverno
  # policies). Merged with each resource's own annotations; when empty no
  # resource renders an `annotations:` block.
  annotations: {}

  # -- List of imagePullSecrets applied to every rendered workload's pod spec,
  # in addition to that workload's own `imagePullSecrets`: the Knative
  # Services (`services.<key>.image.imagePullSecrets`), the Kafka DLQ service
  # (`kafka.sources.<key>.dlq.imagePullSecrets`), and the CNPG PostgreSQL
  # cluster (`postgres.imagePullSecrets`). Same shape as the per-service field
  # — a list of `{name: <secret>}` objects.
  imagePullSecrets: []

  # Default cert-manager issuer for all Certificate resources.
  # Individual components (postgres.certManager, dragonfly.tls.certManager) can
  # override this with their own issuerRef.
  certManager:
    issuerRef:
      # -- Name of the default cert-manager Issuer/ClusterIssuer.
      name: ""
      # -- Kind of the default cert-manager issuer (`Issuer` or `ClusterIssuer`).
      kind: ClusterIssuer
      # -- API group of the default cert-manager issuer.
      group: cert-manager.io

# =============================================================================
# Object Buckets — Map of ObjectBucketClaim entries (Ceph RGW / any S3 store)
#
# Each key renders one ObjectBucketClaim named <release>-<key> and can be
# referenced by postgres.backup.objectStore.bucketRef and/or
# dragonfly.snapshot.bucketRef (postgres and dragonfly may use different buckets
# in the same release).
#
# Per entry:
#   storageClassName: REQUIRED — the name of an EXISTING bucket StorageClass
#     (e.g. a Rook/Ceph bucket SC). It is referenced only; this chart never
#     renders a StorageClass.
#   bucketName: optional — defaults to "<release>-<key>" (truncated to 63).
#   endpointURL: optional full URL (e.g. http://rgw.example:80). CNPG uses it
#     literally; Dragonfly derives the host:port and --s3_use_https from it.
#   region: optional — injected as AWS_REGION for Dragonfly S3 snapshots.
#
# Prerequisites (NOT created by this chart): the ObjectBucketClaim CRDs
# (lib-bucket-provisioner) and a bucket StorageClass must already exist.
# Example:
#   objectBuckets:
#     backups:
#       storageClassName: ceph-bucket
#       endpointURL: http://rgw.example:80
# =============================================================================
# -- Map of ObjectBucketClaim entries, keyed by an arbitrary bucket name. Each
# key renders an ObjectBucketClaim named `<release>-<key>`; see the
# Object Buckets section for the per-entry schema.
objectBuckets: {}

# =============================================================================
# Services — Map of Knative Services (one or more)
#
# Each key becomes a name suffix: <release-name>-<key>
# Use nameOverride to change the suffix (or set to "" for no suffix).
# Example:
#   services:
#     api:
#       image: { repository: ghcr.io/org/api, tag: v1.0.0 }
#     worker:
#       image: { repository: ghcr.io/org/worker, tag: v1.0.0 }
#     app:
#       nameOverride: ""    # produces just <release-name> with no suffix
#       image: { repository: ghcr.io/org/app, tag: v1.0.0 }
# =============================================================================
services:
  # The `api` entry below is the default example. Consumers may use any key;
  # the key becomes the service name suffix (`<release>-<key>`).
  api:
    # Container image configuration
    image:
      # -- Container image repository.
      repository: ""
      # -- Container image tag. `latest` is mutable, so deploys are
      # non-reproducible and can silently change; it also forces the image pull
      # policy to `Always` (see `image.pullPolicy`). Pin an immutable tag, or set
      # `image.digest` for full reproducibility.
      tag: "latest"
      # -- Immutable container image digest (e.g. `sha256:...`). When set the
      # image renders as `repository@digest` and `tag` is ignored — the
      # cache-safe, reproducible alternative to a mutable tag.
      digest: ""
      # -- Image pull policy. Forced to `Always` when the resolved image is the
      # mutable `latest` tag (and no `digest` is set), so nodes never serve a
      # stale cached image; otherwise this value is used as-is.
      pullPolicy: IfNotPresent
      # -- List of imagePullSecrets attached to the pod spec (private registries).
      imagePullSecrets: []
      # -- Flux image policy annotation.
      fluxImagePolicy: ""

    # Knative autoscaling
    scaling:
      # -- Minimum number of replicas.
      minScale: 1
      # -- Maximum number of replicas.
      maxScale: 10
      # -- Autoscaling target (requests in flight per pod for the KPA).
      target: 100
      # -- Maximum concurrent requests per pod.
      containerConcurrency: 100
      # -- Request timeout in seconds.
      timeoutSeconds: 300
      # -- Autoscaler class (e.g. `kpa.autoscaling.knative.dev` or `hpa.autoscaling.knative.dev`).
      class: ""
      # -- Autoscaling metric: `concurrency`, `rps` (KPA), or `cpu`, `memory`,
      # custom metric (HPA class only). Empty falls back to the Knative default
      # (`concurrency`).
      metric: ""

    # -- Container CPU/memory requests and limits.
    # @default -- `100m`/`64Mi` requests, `500m`/`256Mi` limits (see `values.yaml`)
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

    # -- Container port exposed by the Knative Service.
    port: 8080

    # Health probes
    probes:
      # -- Liveness probe configuration (`httpGet`).
      # @default -- see `values.yaml`
      liveness:
        path: /health/live
        port: 8080
        initialDelaySeconds: 3
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      # -- Readiness probe configuration (`httpGet`).
      # @default -- see `values.yaml`
      readiness:
        path: /health/ready
        port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 2

    # -- Environment variables for the container.
    env: []

    # -- envFrom sources (Secrets/ConfigMaps) for the container.
    envFrom: []

    # -- Container security context (non-root, read-only root fs, drops all
    # capabilities).
    # @default -- see `values.yaml`
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    # -- Additional volume mounts for the container.
    volumeMounts: []

    # -- Additional pod volumes.
    volumes: []

    # -- Annotations added to the pod template (Prometheus scraping enabled by
    # default).
    # @default -- see `values.yaml`
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: "/metrics"

    # -- Annotations added to the Knative Service (Prometheus scraping enabled
    # by default).
    # @default -- see `values.yaml`
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: "/metrics"

    # -- Additional labels for the Knative Service.
    labels: {}

    # Flagger Canary Release (per-service opt-in)
    flagger:
      # -- Enable a Flagger canary for this service.
      enabled: false

      analysis:
        # -- Interval between canary analysis checks (Go duration, e.g. `1m`).
        interval: 1m
        # -- Number of failed checks before the canary is rolled back.
        threshold: 5
        # -- Maximum traffic weight (%) assigned to the canary.
        maxWeight: 50
        # -- Traffic weight increment (%) per successful step.
        stepWeight: 10
        # -- Maximum seconds for the canary to make progress before rollback.
        progressDeadlineSeconds: 120

      metrics:
        # -- Minimum success rate (%) required to promote the canary.
        successRateThreshold: 99
        # -- Maximum p99 latency (ms) allowed during analysis.
        latencyP99ThresholdMs: 500

      loadTest:
        # -- Enable k6 load testing during canary analysis.
        enabled: true
        # -- URL of the k6 webhook service that starts load tests.
        webhookUrl: http://k6-loadtester.flagger-system/launch-test
        # -- Number of virtual users for the k6 load test.
        vus: 10
        # -- Duration of the k6 load test.
        duration: 1m
        # -- p95 latency threshold (ms) for the load test.
        p95ThresholdMs: 500
        # -- Maximum error rate (fraction) tolerated by the load test.
        errorRateThreshold: 0.01
        # -- Override the entire k6 load-test script.
        script: ""

# =============================================================================
# CloudNativePG PostgreSQL
# =============================================================================
postgres:
  # -- Enable the CloudNativePG PostgreSQL cluster.
  enabled: false

  # -- PostgreSQL major version.
  version: "16"
  # -- Number of PostgreSQL instances (1–16).
  instances: 3

  # -- List of imagePullSecrets for the CNPG PostgreSQL cluster pods (private
  # registries), applied in addition to `global.imagePullSecrets`. Same shape
  # as `services.<key>.image.imagePullSecrets` — a list of `{name: <secret>}`
  # objects.
  imagePullSecrets: []

  # Name of the ClusterImageCatalog to pull the postgres image from.
  # imageCatalogRef requires a name (CNPG rejects the Cluster without it).
  imageCatalog:
    # -- Name of the ClusterImageCatalog to pull the PostgreSQL image from.
    name: "postgresql"

  # -- PostgreSQL server configuration parameters (TLS 1.3, buffers,
  # synchronous replication, ...).
  # @default -- see `values.yaml`
  parameters:
    ssl: "on"
    ssl_min_protocol_version: "TLSv1.3"
    ssl_max_protocol_version: "TLSv1.3"
    shared_buffers: "2Gi"
    max_connections: "300"
    synchronous_commit: "remote_apply"
    synchronous_standby_names: "ANY 1 (*)"
    archive_timeout: "5min"
    wal_compression: "on"

  # -- Shared libraries preloaded by PostgreSQL.
  sharedPreloadLibraries:
    - pg_stat_statements

  # -- SQL statements run after cluster initialization. The default enables
  # only `pg_stat_statements`. Statement logging is intentionally off because
  # `log_statement = 'all'` writes every statement — including credentials and
  # PII — to the Postgres logs, and `log_min_duration_statement` duplicates
  # slow-query logging. It is opt-in: append the `ALTER SYSTEM` statements shown
  # in the comment below to enable it.
  postInitSQL:
    - "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
  #
  # Statement logging is opt-in. To enable it, append entries like these:
  #   - "ALTER SYSTEM SET log_statement = 'ddl';"
  #   - "ALTER SYSTEM SET log_min_duration_statement = '1000';"

  # -- Cluster CPU/memory requests and limits.
  # @default -- `1`/`2Gi` requests, `2`/`4Gi` limits (see `values.yaml`)
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  storage:
    # -- Persistent volume size per instance.
    size: "200Gi"
    # -- StorageClass for the instance volumes.
    storageClassName: "standard"

  pooler:
    # -- Enable the PgBouncer pooler.
    enabled: true
    # -- Number of pooler replicas (>= 1).
    instances: 3
    # -- Pooler type (`rw` or `ro`).
    type: rw
    # -- Pooler mode (`session` or `transaction`).
    poolMode: transaction
    # -- PgBouncer configuration parameters.
    # @default -- see `values.yaml`
    parameters:
      max_client_conn: "300"
      default_pool_size: "25"
      reserve_pool_size: "5"
      reserve_pool_timeout: "5"
      max_db_connections: "100"
      server_lifetime: "3600"
      server_idle_timeout: "600"
      log_connections: "1"
      log_disconnections: "1"
      log_pooler_errors: "1"
    # -- Pooler CPU/memory requests and limits.
    # @default -- see `values.yaml`
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

  backup:
    # -- Enable WAL archiving and scheduled backups.
    enabled: true
    # -- Cron schedule for backups.
    schedule: "0 2 * * *"
    # -- Backup target (`prefer-standby` or `primary`).
    target: prefer-standby
    # -- Backup retention period (e.g. `30d`).
    retentionPolicy: "30d"
    objectStore:
      # -- Destination path for backups (e.g. `s3://bucket/path`). Derived from
      # `bucketRef` when it is set.
      destinationPath: ""
      # -- S3 endpoint URL. Derived from the referenced bucket when `bucketRef`
      # is set.
      endpointURL: ""
      s3Credentials:
        # -- Secret holding the S3 credentials.
        secretName: postgres-backup-storage
        # -- Key within the credentials Secret holding the access key id.
        accessKeyIdKey: ACCESS_KEY_ID
        # -- Key within the credentials Secret holding the secret access key.
        secretAccessKeyKey: ACCESS_SECRET_KEY
      data:
        # -- Compression algorithm for data backups (`snappy`, `gzip`, `bzip2`
        # or `lz4`).
        compression: gzip
        # -- Number of parallel jobs for data backups.
        jobs: 2
      wal:
        # -- Compression algorithm for WAL backups.
        compression: gzip
        # -- Maximum number of parallel WAL uploads.
        maxParallel: 4

  monitoring:
    # -- Enable the PodMonitor and Prometheus alert rules.
    enabled: true
    # -- Alert thresholds for the Prometheus rules.
    # @default -- see `values.yaml`
    alerts:
      replicationLagWarning: 10
      replicationLagCritical: 60
      highConnectionCount: 50
    # -- Labels merged into the rendered PodMonitor's `metadata.labels`, in
    # addition to the standard chart labels. These must match the Prometheus
    # operator's `podMonitorSelector` or the monitor is silently ignored — for
    # kube-prometheus-stack set `release` to the stack's Helm release name.
    podMonitorLabels:
      release: prometheus
    # -- Labels merged into the rendered PrometheusRule's `metadata.labels`, in
    # addition to the standard chart labels. These must match the Prometheus
    # operator's `ruleSelector` or the rules are silently ignored — for
    # kube-prometheus-stack the default `prometheus: kube-prometheus` matches.
    prometheusRuleLabels:
      prometheus: kube-prometheus

  # cert-manager integration — generates server + client TLS certificates
  # via CNPG's native spec.certificates support.
  # Requires cert-manager CRDs and an Issuer/ClusterIssuer in the cluster.
  certManager:
    # -- Generate PostgreSQL TLS certificates via cert-manager.
    enabled: false
    # Override global.certManager.issuerRef for postgres certificates
    issuerRef:
      # -- Override `global.certManager.issuerRef` for PostgreSQL certificates.
      name: ""
      # -- Kind of the PostgreSQL cert-manager issuer.
      kind: ""
      # -- API group of the PostgreSQL cert-manager issuer.
      group: ""

# =============================================================================
# Kafka Event Sources — Map of KafkaSource entries
#
# Each key becomes a name suffix: <release-name>-<key>-kafka-source
# The "sink" field must reference a key in the services map.
# Example:
#   kafka:
#     sources:
#       events:
#         topic: my-events
#         sink: api
#       commands:
#         topic: my-commands
#         sink: worker
# =============================================================================
kafka:
  # -- Map of KafkaSource entries, keyed by source name. Each key renders a
  # KafkaSource named `<release>-<key>-kafka-source`; every entry's `sink` must
  # reference a key in `services` (validated at render time). See the Kafka
  # Event Sources section for the per-entry schema.
  sources: {}

# =============================================================================
# DragonflyDB Cache Cluster
# =============================================================================
dragonfly:
  # -- Enable the DragonflyDB cache cluster.
  enabled: false

  # -- DragonflyDB container image repository.
  image: docker.dragonflydb.io/dragonflydb/dragonfly
  # -- DragonflyDB container image tag.
  imageTag: "v1.21.2"

  # -- Total number of Dragonfly instances including the master (1–16).
  replicas: 3

  # -- Extra Dragonfly CLI arguments (e.g. `--cluster_mode=emulated`).
  args: []

  # -- Extra environment variables for the Dragonfly container.
  env: []

  # -- Dragonfly container CPU/memory requests and limits.
  # @default -- `500m`/`512Mi` requests, `1`/`1Gi` limits (see `values.yaml`)
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  # Authentication — reference a Secret containing the password
  authentication:
    passwordFromSecret:
      # -- Secret containing the Dragonfly password.
      name: ""
      # -- Key within the password Secret.
      key: password
    # Optional mTLS client CA cert
    clientCaCertSecret:
      # -- Secret containing the mTLS client CA certificate.
      name: ""
      # -- Key within the client CA Secret.
      key: ca.crt

  # TLS — reference a Secret containing tls.crt / tls.key
  tls:
    # -- Secret containing `tls.crt`/`tls.key`. Ignored when
    # `tls.certManager.enabled` is true.
    secretName: ""
    # cert-manager integration — generates a Certificate resource whose
    # secret is automatically wired into tlsSecretRef.
    # When enabled, tls.secretName is ignored (auto-generated name is used).
    certManager:
      # -- Generate the Dragonfly TLS certificate via cert-manager.
      enabled: false
      # Override global.certManager.issuerRef for the dragonfly certificate
      issuerRef:
        # -- Override `global.certManager.issuerRef` for the Dragonfly certificate.
        name: ""
        # -- Kind of the Dragonfly cert-manager issuer.
        kind: ""
        # -- API group of the Dragonfly cert-manager issuer.
        group: ""
      # -- Requested certificate lifetime.
      duration: "2160h"
      # -- How long before expiry the certificate is renewed.
      renewBefore: "360h"

  # Snapshot / persistence configuration
  snapshot:
    # -- Enable snapshot persistence.
    enabled: false
    # -- Cron schedule for snapshots.
    cron: "0 */6 * * *"
    # -- Take snapshots only on the master instance.
    enableOnMasterOnly: true
    # -- S3 backup path (`s3://bucket/path`); mutually exclusive with an
    # existing PVC. Derived from `snapshot.bucketRef` when it is set.
    dir: ""
    # -- Use an existing PVC for snapshots (mutually exclusive with `dir` and
    # `snapshot.bucketRef`).
    existingPersistentVolumeClaimName: ""
    # PVC storage (used only when dir and existingPVC are empty)
    storage:
      # -- PVC size when neither `dir` nor an existing PVC is set.
      size: "10Gi"
      # -- StorageClass for the snapshot PVC.
      storageClassName: ""

  # Kubernetes Service configuration
  serviceSpec:
    # -- Kubernetes Service type.
    type: ClusterIP
    # -- Override the generated Service name.
    name: ""
    # -- Node port (only used when `type` is `NodePort`).
    nodePort: 0
    # -- Annotations for the Dragonfly Service.
    annotations: {}
    # -- Labels for the Dragonfly Service.
    labels: {}

  # PodDisruptionBudget (minAvailable and maxUnavailable are mutually exclusive: at most one may be
  # non-zero — setting both fails render-time validation; a field left at 0 is treated as unset)
  pdb:
    # -- Minimum available pods for the PodDisruptionBudget (mutually exclusive
    # with `maxUnavailable`).
    minAvailable: 2
    # -- Maximum unavailable pods for the PodDisruptionBudget (mutually
    # exclusive with `minAvailable`).
    maxUnavailable: 0

  # Scheduling
  # -- Pod affinity rules.
  affinity: {}
  # -- Pod tolerations.
  tolerations: []
  # -- Pod topology spread constraints.
  topologySpreadConstraints: []
  # -- Node selector for the Dragonfly pods.
  nodeSelector: {}

  # Security contexts
  # -- Pod-level security context.
  podSecurityContext: {}
  # -- Container-level security context.
  containerSecurityContext: {}

  # -- ServiceAccount used by the Dragonfly pods.
  serviceAccountName: ""

  # -- PriorityClass for the Dragonfly pods.
  priorityClassName: ""

# =============================================================================
# Kyverno Admission Policies (opt-in)
#
# Renders Kyverno NamespacedValidatingPolicy guardrails into the release
# namespace. Requires Kyverno >= 1.16 (policies.kyverno.io/v1beta1); use
# policies.kyverno.io/v1 on Kyverno >= 1.17.
# =============================================================================
kyverno:
  # -- Render the Kyverno admission policies.
  enabled: false
  scaling:
    # -- Render the scaling/HA guardrail policies (Knative Service, CNPG
    # instances, Dragonfly replicas/PDB).
    enabled: false
    # -- Policy `apiVersion` (`policies.kyverno.io/v1beta1` for Kyverno >= 1.16,
    # `policies.kyverno.io/v1` for Kyverno >= 1.17).
    apiVersion: policies.kyverno.io/v1beta1
    # -- Enforcement actions (`Deny` and/or `Audit`).
    validationActions:
      - Deny
