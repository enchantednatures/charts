# StorageClass used by the example's ObjectBucketClaim. The Rook operator
# reconciles the claim through the lib-bucket-provisioner CRDs.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-bucket
provisioner: rook-ceph.ceph.rook.io/bucket
reclaimPolicy: Retain
parameters:
  objectStoreName: ceph-objectstore
  objectStoreNamespace: rook-ceph
