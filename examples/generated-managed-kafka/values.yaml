# Values snapshot from a project generated by the Rust/Knative Flux template
# with:
#   feature_kafka = true
#   event_source_kafka = true
#   kafka_managed_cluster = true
#   kafka_managed_provider = "redpanda"
#   feature_s3 = true
#   feature_bucket_notifications = true
#   feature_postgres = false
#   feature_flagger = false
#   feature_cron = false
#
# The template's managed-Kafka CI job renders this shape. Keep it in sync when
# the generated HelmRelease values change; the full values are exercised by
# hack/test-upgrade-dry-run.sh and the schema test.
global:
  fullnameOverride: generated-managed-kafka
  labels:
    app.kubernetes.io/part-of: generated-managed-kafka

services:
  app:
    nameOverride: ""
    image:
      repository: ghcr.io/example-org/generated-managed-kafka
      tag: "v1.0.0"
      imagePullSecrets:
        - name: ghcr-pull-secret
    scaling:
      minScale: 1
      maxScale: 10
      target: 100
      containerConcurrency: 100
      timeoutSeconds: 300
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    env:
      - name: APP_ENV
        value: "production"
      - name: APP__SERVER__PORT
        value: "8080"
      - name: APP__KAFKA__BROKER_URL
        value: "generated-managed-kafka-kafka:9093"
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: generated-managed-kafka-app-data
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: generated-managed-kafka-app-data
            key: AWS_SECRET_ACCESS_KEY
      - name: BUCKET_HOST
        valueFrom:
          configMapKeyRef:
            name: generated-managed-kafka-app-data
            key: BUCKET_HOST
      - name: BUCKET_PORT
        valueFrom:
          configMapKeyRef:
            name: generated-managed-kafka-app-data
            key: BUCKET_PORT
      - name: APP__S3__ENDPOINT
        value: "http://$(BUCKET_HOST):$(BUCKET_PORT)"
      - name: APP__S3__BUCKET
        valueFrom:
          configMapKeyRef:
            name: generated-managed-kafka-app-data
            key: BUCKET_NAME
      - name: APP__S3__REGION
        value: "us-east-1"
    objectBuckets:
      app-data:
        mode: env
        envNames:
          bucketName: S3_BUCKET
          bucketHost: S3_HOST
          bucketPort: S3_PORT
          accessKeyId: S3_ACCESS_KEY_ID
          secretAccessKey: S3_SECRET_ACCESS_KEY

objectBuckets:
  app-data:
    storageClassName: ceph-bucket
    endpointURL: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
    objectStore:
      name: ceph-objectstore
      namespace: rook-ceph
    notifications:
      put:
        enabled: true
        filter:
          keyFilters:
            - name: prefix
              value: uploads/

kafka:
  cluster:
    enabled: true
    provider: redpanda
    name: generated-managed-kafka
    replicas: 1
    storage:
      size: "10Gi"
      storageClassName: ceph-block
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "2.5Gi"
    tls:
      enabled: false
    auth:
      type: none
    topics:
      create: true
      partitions: 3
    redpanda:
      # Kyverno clusters commonly reject the operator's privileged tuning init
      # container and pods without regular-container resources. The generated
      # project disables tuning and sizes every generated container.
      extraClusterSpec:
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "2.5Gi"
        config:
          cluster:
            auto_create_topics_enabled: true
        console:
          enabled: false
        monitoring:
          enabled: false
        auth:
          sasl:
            enabled: false
        statefulset:
          initContainers:
            tuning:
              tune_aio_events: false
              apply_host_tuners: false
            configurator:
              resources:
                requests:
                  cpu: "10m"
                  memory: "64Mi"
                limits:
                  memory: "128Mi"
          podTemplate:
            spec:
              containers:
                - name: sidecar
                  resources:
                    requests:
                      cpu: "10m"
                      memory: "256Mi"
                    limits:
                      memory: "512Mi"
          sideCars:
            resources:
              requests:
                cpu: "10m"
                memory: "256Mi"
              limits:
                memory: "512Mi"
        post_install_job:
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
        post_upgrade_job:
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "128Mi"

  broker:
    enabled: true
    config:
      topicPartitions: 3
    delivery:
      retry: 5
      backoffPolicy: exponential
      backoffDelay: "PT1S"

  triggers:
    events:
      subscriber: "app"
      delivery:
        retry: 5
        backoffPolicy: exponential
        backoffDelay: "PT1S"
    s3-events:
      subscriber: "app"
      filter:
        # KafkaSource sets the CloudEvent source to
        # /apis/v1/namespaces/<ns>/kafkasources/<name>#<topic>.
        source: "/apis/v1/namespaces/generated-managed-kafka/kafkasources/generated-managed-kafka-s3-events-kafka-source#generated-managed-kafka-app-data-put"
      delivery:
        retry: 5
        backoffPolicy: exponential
        backoffDelay: "PT1S"

  sources:
    events:
      topic: "events"
      consumerGroup: "generated-managed-kafka-consumers"
      consumers: 3
      initialOffset: latest
      delivery:
        retry: 5
        backoffPolicy: exponential
        backoffDelay: "PT1S"
      dlq:
        enabled: true
        image:
          repository: "gcr.io/knative-releases/knative.dev/eventing/cmd/event_display"
          tag: "v1.23.0"
        scaling:
          minScale: 0
          maxScale: 2
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

    s3-events:
      topic: "generated-managed-kafka-app-data-put"
      consumerGroup: "generated-managed-kafka-s3-events"
      consumers: 1
      initialOffset: latest
      delivery:
        retry: 5
        backoffPolicy: exponential
        backoffDelay: "PT1S"
      dlq:
        enabled: true
        image:
          repository: "gcr.io/knative-releases/knative.dev/eventing/cmd/event_display"
          tag: "v1.23.0"
        # Knative >= 1.23 rejects the chart's POD_NAME/POD_NAMESPACE fieldRef
        # env, so the generated project opts out with an empty list.
        env: []
        scaling:
          minScale: 0
          maxScale: 2
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
