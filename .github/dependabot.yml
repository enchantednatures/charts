version: 2

updates:
  # Keep GitHub Actions pinned to commit SHAs up to date. The `# vX.Y.Z`
  # trailing comments on every `uses:` line let Dependabot recognize and bump
  # the pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the pinned Python CI dependencies current. requirements-ci.txt is the
  # single install source for every workflow that needs Python packages.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-ci:
        patterns:
          - "*"
