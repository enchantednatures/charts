name: Release Chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/**/Chart.yaml'
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      chart:
        description: Chart name to release (for example ksvc or ksvc-app)
        required: true
        type: string
      version:
        description: Chart version to release (must match Chart.yaml)
        required: true
        type: string
      repair:
        description: Only repair a missing tag or GitHub Release for an already-published OCI artifact
        required: false
        default: false
        type: boolean
      commit:
        description: Commit that produced the chart version (defaults to the commit that introduced it)
        required: false
        type: string

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Charts to Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_library: ${{ steps.build-matrix.outputs.has_library }}
      release_commit: ${{ steps.build-matrix.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build release matrix
        id: build-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_CHART: ${{ inputs.chart }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REPAIR: ${{ inputs.repair }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: hack/release/detect-charts.sh

  gate:
    name: Verify Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: detect
    permissions:
      contents: read
      checks: read
      actions: read
    if: needs.detect.outputs.matrix != '' && toJSON(fromJSON(needs.detect.outputs.matrix).include) != '[]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Wait for required checks on the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          hack/release/check-required-checks.sh
          --commit "${{ needs.detect.outputs.release_commit }}"
          --timeout 3300

  release:
    name: "Release ${{ matrix.name }} v${{ matrix.version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect, gate]
    permissions:
      contents: write
      packages: write
      id-token: write
    environment: release
    if: needs.detect.outputs.matrix != '' && toJSON(fromJSON(needs.detect.outputs.matrix).include) != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - name: Verify chart version matches release version
        run: |
          CHART_PATH="${{ matrix.path }}"
          EXPECTED="${{ matrix.version }}"
          ACTUAL="$(grep '^version:' "$CHART_PATH/Chart.yaml" | head -1 | awk '{print $2}')"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::$CHART_PATH/Chart.yaml version is '$ACTUAL' but the release expects '$EXPECTED'. Refusing to rewrite the version silently — fix the chart or the tag."
            exit 1
          fi

          echo "OK: $CHART_PATH version $ACTUAL matches release version $EXPECTED"

      - name: Helm lint
        run: |
          CHART_PATH="${{ matrix.path }}"
          CHART_TYPE="${{ matrix.type }}"

          if [[ "$CHART_TYPE" == "application" ]]; then
            helm dependency build "$CHART_PATH"
          fi

          helm lint "$CHART_PATH"

      - name: Cache helm-unittest plugin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/helm/plugins
          key: unittest-v0.8.2-${{ runner.os }}

      - name: Install helm-unittest plugin
        run: helm plugin list | grep -q unittest || helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.8.2

      - name: Run unit tests (library charts)
        if: matrix.type == 'library'
        run: |
          CHART_PATH="${{ matrix.path }}"
          if [[ -d "$CHART_PATH/test-chart" ]]; then
            helm dependency build "$CHART_PATH/test-chart"
            helm unittest "$CHART_PATH/test-chart"
          else
            echo "No test-chart found, skipping unit tests"
          fi

      - name: Run unit tests (application charts)
        if: matrix.type == 'application'
        run: |
          CHART_PATH="${{ matrix.path }}"
          # The Helm lint step above already ran `helm dependency build` for
          # application charts, so the pinned dependency is in charts/.
          helm unittest "$CHART_PATH" --with-subchart=false

      - name: Login to OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0

      - name: Reconcile OCI artifact, git tag, and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPAIR: ${{ matrix.repair }}
        run: |
          args=(
            --chart "${{ matrix.name }}"
            --version "${{ matrix.version }}"
            --path "${{ matrix.path }}"
            --type "${{ matrix.type }}"
            --tag "${{ matrix.tag }}"
            --commit "${{ matrix.commit }}"
          )
          if [[ "${REPAIR}" == "true" ]]; then
            args+=(--repair)
          fi
          hack/release/reconcile-release.sh "${args[@]}"

      - name: Sign, attest, and attach SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          hack/release/sign-release.sh \
            --chart "${{ matrix.name }}" \
            --version "${{ matrix.version }}" \
            --path "${{ matrix.path }}" \
            --tag "${{ matrix.tag }}" \
            --commit "${{ matrix.commit }}"

  update-dependents:
    name: Update Dependent Charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect, release]
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.has_library == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - name: Login to OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Update dependent app charts and create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASED='${{ needs.detect.outputs.matrix }}'
          UPDATED_ANY="false"
          UPDATED_DIRS=""
          BRANCH_NAME="chore/bump-deps-$(date +%s)"
          PR_BODY="Automated dependency bump triggered by library chart release.\n\n**Updated dependencies:**\n"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"

          # For each released library chart, find and update dependent app charts
          for row in $(echo "$RELEASED" | jq -c '.include[] | select(.type == "library")'); do
            LIB_NAME=$(echo "$row" | jq -r '.name')
            LIB_VERSION=$(echo "$row" | jq -r '.version')

            echo "Looking for app charts depending on $LIB_NAME..."

            for app_chart in charts/app/*/Chart.yaml; do
              [[ -f "$app_chart" ]] || continue

              # Check if this app chart depends on the released library
              if ! grep -q "name: $LIB_NAME" "$app_chart"; then
                continue
              fi

              APP_NAME=$(grep '^name:' "$app_chart" | head -1 | awk '{print $2}')
              OLD_APP_VERSION=$(grep '^version:' "$app_chart" | head -1 | awk '{print $2}')

              # Bump app chart patch version
              IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_APP_VERSION"
              NEW_APP_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

              echo "Updating $APP_NAME: version $OLD_APP_VERSION -> $NEW_APP_VERSION, dep $LIB_NAME -> $LIB_VERSION"

              # Update the app chart version
              sed -i "s/^version: ${OLD_APP_VERSION}/version: ${NEW_APP_VERSION}/" "$app_chart"

              # Update the dependency version for this library
              awk -v lib="$LIB_NAME" -v ver="$LIB_VERSION" '
                /^dependencies:/ { in_deps=1 }
                in_deps && /- name:/ { in_dep_entry=1; is_target=0 }
                in_deps && in_dep_entry && $0 ~ "name: " lib { is_target=1 }
                in_deps && in_dep_entry && is_target && /version:/ {
                  sub(/version: .*/, "version: " ver)
                  is_target=0; in_dep_entry=0
                }
                { print }
              ' "$app_chart" > "${app_chart}.tmp" && mv "${app_chart}.tmp" "$app_chart"

              PR_BODY+="- \`$APP_NAME\` $OLD_APP_VERSION → $NEW_APP_VERSION (dep \`$LIB_NAME\` → $LIB_VERSION)\n"
              UPDATED_ANY="true"
              UPDATED_DIRS+=" $(dirname "$app_chart")"
            done
          done

          if [[ "$UPDATED_ANY" == "false" ]]; then
            echo "No dependent charts to update"
            exit 0
          fi

          # Regenerate each updated chart's committed Chart.lock so it tracks the
          # just-released library version; CI resolves dependencies with
          # `helm dependency build`, which requires the lock to be in sync.
          for app_dir in $UPDATED_DIRS; do
            echo "Refreshing Chart.lock for $app_dir"
            helm dependency update "$app_dir"
          done

          git add charts/app/*/Chart.yaml charts/app/*/Chart.lock
          git commit -m "chore: bump dependent chart versions"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "chore: bump dependent chart versions" \
            --body "$(echo -e "$PR_BODY")" \
            --base main \
            --head "$BRANCH_NAME"
