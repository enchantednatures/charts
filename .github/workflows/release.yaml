name: Release Chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/**/Chart.yaml'
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      chart:
        description: Chart name to release (for example ksvc or ksvc-app)
        required: true
        type: string
      version:
        description: Chart version to release (must match Chart.yaml)
        required: true
        type: string
      repair:
        description: Only repair a missing tag or GitHub Release for an already-published OCI artifact
        required: false
        default: false
        type: boolean
      commit:
        description: Commit that produced the chart version (defaults to the commit that introduced it)
        required: false
        type: string

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Charts to Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_library: ${{ steps.build-matrix.outputs.has_library }}
      release_commit: ${{ steps.build-matrix.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build release matrix
        id: build-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_CHART: ${{ inputs.chart }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REPAIR: ${{ inputs.repair }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: hack/release/detect-charts.sh

  gate:
    name: Verify Required Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: detect
    permissions:
      contents: read
      checks: read
      actions: read
    if: needs.detect.outputs.matrix != '' && toJSON(fromJSON(needs.detect.outputs.matrix).include) != '[]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Wait for required checks on the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          hack/release/check-required-checks.sh
          --commit "${{ needs.detect.outputs.release_commit }}"
          --timeout 3300

  release:
    name: "Release ${{ matrix.name }} v${{ matrix.version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect, gate]
    permissions:
      contents: write
      packages: write
      id-token: write
    environment: release
    if: needs.detect.outputs.matrix != '' && toJSON(fromJSON(needs.detect.outputs.matrix).include) != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - name: Verify chart version matches release version
        run: |
          CHART_PATH="${{ matrix.path }}"
          EXPECTED="${{ matrix.version }}"
          ACTUAL="$(grep '^version:' "$CHART_PATH/Chart.yaml" | head -1 | awk '{print $2}')"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::$CHART_PATH/Chart.yaml version is '$ACTUAL' but the release expects '$EXPECTED'. Refusing to rewrite the version silently — fix the chart or the tag."
            exit 1
          fi

          echo "OK: $CHART_PATH version $ACTUAL matches release version $EXPECTED"

      - name: Helm lint
        run: |
          CHART_PATH="${{ matrix.path }}"
          CHART_TYPE="${{ matrix.type }}"

          if [[ "$CHART_TYPE" == "application" ]]; then
            helm dependency build "$CHART_PATH"
          fi

          helm lint "$CHART_PATH"

      - name: Cache helm-unittest plugin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/helm/plugins
          key: unittest-v0.8.2-${{ runner.os }}

      - name: Install helm-unittest plugin
        run: helm plugin list | grep -q unittest || helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.8.2

      - name: Run unit tests (library charts)
        if: matrix.type == 'library'
        run: |
          CHART_PATH="${{ matrix.path }}"
          if [[ -d "$CHART_PATH/test-chart" ]]; then
            helm dependency build "$CHART_PATH/test-chart"
            helm unittest "$CHART_PATH/test-chart"
          else
            echo "No test-chart found, skipping unit tests"
          fi

      - name: Run unit tests (application charts)
        if: matrix.type == 'application'
        run: |
          CHART_PATH="${{ matrix.path }}"
          # The Helm lint step above already ran `helm dependency build` for
          # application charts, so the pinned dependency is in charts/.
          helm unittest "$CHART_PATH" --with-subchart=false

      - name: Login to OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0

      - name: Reconcile OCI artifact, git tag, and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPAIR: ${{ matrix.repair }}
        run: |
          args=(
            --chart "${{ matrix.name }}"
            --version "${{ matrix.version }}"
            --path "${{ matrix.path }}"
            --type "${{ matrix.type }}"
            --tag "${{ matrix.tag }}"
            --commit "${{ matrix.commit }}"
          )
          if [[ "${REPAIR}" == "true" ]]; then
            args+=(--repair)
          fi
          hack/release/reconcile-release.sh "${args[@]}"

      - name: Sign, attest, and attach SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          hack/release/sign-release.sh \
            --chart "${{ matrix.name }}" \
            --version "${{ matrix.version }}" \
            --path "${{ matrix.path }}" \
            --tag "${{ matrix.tag }}" \
            --commit "${{ matrix.commit }}"

  e2e:
    name: "Post-publish OCI E2E (${{ matrix.name }} v${{ matrix.version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect, release]
    permissions:
      contents: read
      packages: read
    if: needs.detect.outputs.matrix != '' && toJSON(fromJSON(needs.detect.outputs.matrix).include) != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          fetch-depth: 1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - name: Create Kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: release-e2e
          node_image: kindest/node:v1.32.0

      - name: Install Knative Serving CRDs
        run: make install-knative

      - name: Login to OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Install, upgrade, roll back, and uninstall the published artifact
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          REPOSITORY_OWNER="${GITHUB_REPOSITORY%%/*}"
          hack/release/e2e-oci-install.sh \
            --chart "${{ matrix.name }}" \
            --version "${{ matrix.version }}" \
            --chart-type "${{ matrix.type }}" \
            --oci-repository "oci://${{ env.REGISTRY }}/${REPOSITORY_OWNER}/charts" \
            --release-name "release-e2e-${{ matrix.name }}" \
            --namespace release-e2e

  update-dependents:
    name: Update Dependent Charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect, release]
    permissions:
      contents: write
      pull-requests: write
      packages: read
    if: >-
      needs.detect.outputs.has_library == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.release_commit }}
          fetch-depth: 1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - name: Login to OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Update dependent charts, refresh locks, and create PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASED_MATRIX: ${{ needs.detect.outputs.matrix }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh auth setup-git
          hack/release/update-dependents.sh \
            --release-commit "${{ needs.detect.outputs.release_commit }}" \
            --base-branch main
