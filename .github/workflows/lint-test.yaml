name: Lint and Test

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'examples/**'
      - 'test/**'
      - 'Makefile'
      - 'hack/**'
      - '.github/workflows/lint-test.yaml'
  pull_request:
    paths:
      - 'charts/**'
      - 'examples/**'
      - 'test/**'
      - 'Makefile'
      - 'hack/**'
      - '.github/workflows/lint-test.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - name: Guard against committed packaged charts
        run: |
          tracked=$(git ls-files -- 'charts/**/charts/*.tgz' 'examples/*/charts/*.tgz')
          if [ -n "$tracked" ]; then
            echo "::error::Stale packaged .tgz files are committed — they shadow the current chart source and make lint/unittest validate stale code:"
            echo "$tracked"
            exit 1
          fi

      - name: Lint all charts and examples
        run: make lint

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema pyyaml

      - name: Validate example values and negative schema cases
        run: python3 hack/test-values-schema.py

  template-render:
    name: Template Rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Render and validate app chart
        run: |
          hack/lint-app.sh helm template test-app charts/app/ksvc \
            --namespace test-ns \
            --set services.api.image.repository=ghcr.io/test/app \
            --set services.api.image.tag=v1.0.0 > /tmp/rendered-app.yaml
          yamllint -d relaxed /tmp/rendered-app.yaml
          echo "Resources rendered for app chart:"
          grep -E "^kind:" /tmp/rendered-app.yaml | sort | uniq -c

      - name: Render and validate all examples
        run: |
          for example in examples/*/; do
            name=$(basename "$example")
            echo "--- Rendering $name ---"
            helm dependency build "$example"
            helm template "test-${name}" "$example" \
              --namespace test-ns > "/tmp/rendered-${name}.yaml"
            yamllint -d relaxed "/tmp/rendered-${name}.yaml"
            echo "Resources rendered for $name:"
            grep -E "^kind:" "/tmp/rendered-${name}.yaml" | sort | uniq -c
          done

      - name: Verify kubeVersion enforcement
        run: hack/check-kube-version.sh

  unit-tests:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - name: Cache helm-unittest plugin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/helm/plugins
          key: unittest-v0.8.2-${{ runner.os }}

      - name: Install helm-unittest plugin
        run: helm plugin list | grep -q unittest || helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.8.2

      - name: Run unit tests
        run: make test

  kubeconform:
    name: Kubernetes Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | \
            tar xz -C /usr/local/bin

      - name: Validate rendered manifests
        run: |
          for example in examples/*/; do
            name=$(basename "$example")
            echo "--- Validating $name ---"
            helm dependency build "$example"
            helm template "test-${name}" "$example" --namespace test-ns | \
              kubeconform \
                -strict \
                -ignore-missing-schemas \
                -summary \
                -skip "Canary,MetricTemplate,KafkaSource,Cluster,ScheduledBackup,ObjectStore,ObjectBucketClaim,Pooler,PodMonitor,PrometheusRule,Dragonfly" \
                -kubernetes-version 1.28.0
          done

  kyverno-policy-tests:
    name: Kyverno Policy Tests
    runs-on: ubuntu-latest
    env:
      KYVERNO_VERSION: v1.19.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Install Kyverno CLI
        run: |
          curl -sL -o /tmp/kyverno.tar.gz \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          mkdir -p /tmp/kyverno-cli
          tar xzf /tmp/kyverno.tar.gz -C /tmp/kyverno-cli
          sudo mv /tmp/kyverno-cli/kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Build test-chart dependency and render policies
        run: |
          rm -f charts/library/ksvc/test-chart/charts/*.tgz
          helm dependency build charts/library/ksvc/test-chart
          helm template guardrails charts/library/ksvc/test-chart \
            --namespace test-ns \
            --set services.api.image.repository=example/app \
            --set kyverno.enabled=true \
            --set kyverno.scaling.enabled=true > /tmp/rendered.yaml
          echo "Rendered kinds:"
          grep -E "^kind:" /tmp/rendered.yaml | sort | uniq -c

      - name: Extract NamespacedValidatingPolicy documents
        run: |
          python3 << 'EOF'
          import yaml, sys
          with open('/tmp/rendered.yaml') as f:
              docs = [d for d in yaml.safe_load_all(f)
                      if d and d.get('kind') == 'NamespacedValidatingPolicy']
          if len(docs) != 3:
              print(f'::error::expected 3 NamespacedValidatingPolicy documents, got {len(docs)}')
              sys.exit(1)
          with open('/tmp/policies.yaml', 'w') as out:
              yaml.safe_dump_all(docs, out, default_flow_style=False, sort_keys=False)
          print(f'Wrote {len(docs)} policies to /tmp/policies.yaml')
          EOF

      - name: Positive — valid resources must be admitted
        run: |
          # kyverno apply exits 0 on success, but ALSO (dangerously) exits 0 when no
          # policies are loaded, so assert that a non-zero rule set ran and nothing failed.
          kyverno apply /tmp/policies.yaml \
            -r test/kyverno/knative-valid.yaml \
            -r test/kyverno/cnpg-valid.yaml \
            -r test/kyverno/dragonfly-valid.yaml > /tmp/kyverno-positive.out 2>&1
          cat /tmp/kyverno-positive.out
          if grep -q "Applying 0 policy rule(s)" /tmp/kyverno-positive.out; then
            echo "::error::No policies were applied — policy extraction failed"
            exit 1
          fi
          if ! grep -q "fail: 0" /tmp/kyverno-positive.out; then
            echo "::error::A valid resource was denied, or a policy CEL failed to compile"
            exit 1
          fi
          echo "OK: all valid resources admitted (CEL compiled)"

      - name: Negative — invalid resources must be denied
        run: |
          check_denied() {
            file="$1"; expected="$2"
            echo "--- Expecting denial: $file ---"
            if kyverno apply /tmp/policies.yaml -r "$file" > /tmp/kyverno-negative.out 2>&1; then
              echo "::error::$file was NOT denied but should have been"
              cat /tmp/kyverno-negative.out
              exit 1
            fi
            cat /tmp/kyverno-negative.out
            if ! grep -qF "$expected" /tmp/kyverno-negative.out; then
              echo "::error::Expected message not found for $file: $expected"
              exit 1
            fi
            echo "OK: $file denied with expected message"
          }
          check_denied test/kyverno/knative-invalid-scale.yaml "min-scale must be <= max-scale"
          check_denied test/kyverno/cnpg-invalid-instances.yaml "spec.instances must be between 1 and 16"
          check_denied test/kyverno/dragonfly-invalid-replicas.yaml "spec.replicas must be between 1 and 16"

  version-check:
    name: Chart version bump check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch origin "${{ github.base_ref }}"

      - name: Check chart version bumps
        run: hack/check-version-bump.sh "origin/${{ github.base_ref }}"
