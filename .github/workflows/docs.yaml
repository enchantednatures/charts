name: Docs

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - '**/*.md'
      - 'charts/**'
      - 'Makefile'
      - 'hack/**'
      - '.helmdocsignore'
      - '.markdownlint-cli2.yaml'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - '*.md'
      - '**/*.md'
      - 'charts/**'
      - 'Makefile'
      - 'hack/**'
      - '.helmdocsignore'
      - '.markdownlint-cli2.yaml'
      - '.github/workflows/docs.yaml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-docs:
    name: Helm Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Regenerate chart documentation
        run: make docs

      - name: Fail if generated docs are out of sync
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated documentation is out of date. Run 'make docs' locally and commit the result."
            exit 1
          fi

  requirements:
    name: Requirements Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check README requirements against chart sources
        run: python3 hack/check-requirements-docs.py

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.17.2

  links:
    name: Markdown Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check local links
        run: python3 hack/check-markdown-links.py

      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            --max-retries 3
            --timeout 20
            README.md charts/library/ksvc/README.md flux/README.md
          fail: true
          lycheeVersion: v0.24.2
